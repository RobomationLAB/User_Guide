# docs.robomationlab.com 배포
name: deploy docs

on:
  push:
    branches: [main]
    # 사이트 산출물에 영향이 없는 파일만 바뀐 푸시는 건너뛴다.
    paths-ignore:
      - 'docs/GLOSSARY.md'
      - 'docs/TRANSLATION.md'
      - 'README.md'
      - '.claude/**'
  # Actions 탭에서 손으로 돌릴 수 있게 한다 (설정 변경 후 재배포 등).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 된다. 진행 중인 배포는 취소하지 않고 순서대로 끝낸다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: check
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: configure pages
        uses: actions/configure-pages@v5

      - name: install dependencies
        run: npm ci

      # 빌드가 잡지 못하는 것들을 점검한다 —
      # 파일명 집합 · 앵커 id 집합 · ](파일#앵커) 해석 · BlockImage 이미지 실물 · 미번역 한글.
      # 문제가 있으면 exit 1 이라 배포가 멈춘다.
      # 착수하지 않은 언어는 '미착수' 한 줄로 표시될 뿐 실패하지 않는다.
      - name: check i18n
        run: npm run check:i18n

      # 죽은 문서 링크와 중복 앵커 id 는 여기서 걸린다.
      - name: build
        run: npm run docs:build

      # docs/public/ 의 CNAME · logo.png · images/ 는 이미 dist 안에 복사되어 있다.
      - name: upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy pages
        id: deployment
        uses: actions/deploy-pages@v4
